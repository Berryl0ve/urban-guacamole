<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide for icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="plane-takeoff" class="w-8 h-8"></i>
                <h1 class="text-2xl font-bold tracking-wide">WanderGenius AI</h1>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">
        
        <!-- Input Form Section -->
        <div class="w-full md:w-1/3 space-y-6">
            
            <!-- API Key & Model Configuration Panel -->
            <div class="bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-700 text-white">
                <h2 class="text-lg font-bold mb-3 flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5 text-blue-400"></i> API Settings
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Google Gemini API Key</label>
                        <input type="password" id="uiApiKey" placeholder="Paste your API key here..." 
                               class="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm text-white">
                        <p class="text-[10px] text-slate-400 mt-1">Key is saved securely in your browser.</p>
                    </div>
                    <button id="connectBtn" type="button" class="w-full bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-2 rounded-lg transition-colors">
                        Connect & Find Models
                    </button>
                    
                    <div id="modelContainer" class="hidden mt-3 pt-3 border-t border-slate-600">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Your Available Models</label>
                        <select id="aiModel" class="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm text-white">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div id="apiStatus" class="text-xs mt-2 hidden rounded p-2"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="map-pin" class="w-5 h-5 text-blue-500"></i> Trip Details
                </h2>
                
                <form id="travelForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Departure City</label>
                            <input type="text" id="departure" required placeholder="e.g., JFK, New York" 
                                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Destination</label>
                            <input type="text" id="destination" required placeholder="e.g., Tokyo" 
                                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Flight Class</label>
                            <select id="flightClass" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                <option value="Economy">Economy</option>
                                <option value="Premium Economy">Premium Economy</option>
                                <option value="Business">Business</option>
                                <option value="First Class">First Class</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Pref. Airlines</label>
                            <input type="text" id="prefAirlines" placeholder="e.g., Delta, ANA (Optional)" 
                                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Start Date</label>
                            <input type="date" id="startDate" required 
                                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">End Date</label>
                            <input type="date" id="endDate" required 
                                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Travelers</label>
                            <input type="number" id="numPeople" min="1" required placeholder="e.g., 2" 
                                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Ages</label>
                            <input type="text" id="ages" required placeholder="e.g., 25, 28" 
                                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Interests</label>
                        <textarea id="interests" required rows="2" placeholder="e.g., Hiking, food, museums" 
                                  class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Hotel Prefs</label>
                        <textarea id="hotelPrefs" required rows="2" placeholder="e.g., Free breakfast, central" 
                                  class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" disabled
                            class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium py-3 rounded-lg transition-colors flex justify-center items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> Generate Itinerary
                    </button>
                    <p id="submitWarning" class="text-xs text-red-500 text-center">Connect your API key first.</p>
                </form>
            </div>
        </div>

        <!-- Output / Results Section -->
        <div class="w-full md:w-2/3 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100 min-h-[500px] flex flex-col relative">
            
            <div id="initialState" class="flex-1 flex flex-col items-center justify-center text-slate-400 text-center space-y-4 fade-in">
                <i data-lucide="map" class="w-16 h-16 opacity-50"></i>
                <p class="text-lg">Paste your API key, connect, and let AI plan your trip.</p>
            </div>

            <div id="loadingState" class="hidden flex-1 flex flex-col items-center justify-center text-slate-600 space-y-4">
                <div class="loader"></div>
                <p class="font-medium animate-pulse">Communicating with Google AI...</p>
                <p class="text-sm text-slate-400">Pricing flights, finding hotels, and planning activities...</p>
            </div>

            <div id="errorState" class="hidden flex-1 flex flex-col items-center justify-center text-red-500 space-y-4 fade-in">
                <i data-lucide="alert-triangle" class="w-12 h-12"></i>
                <h3 class="font-bold text-xl text-red-700">Error</h3>
                <p id="errorMessage" class="font-medium text-center text-red-800 text-sm max-w-md bg-red-50 p-4 rounded-lg border border-red-200 break-words"></p>
            </div>

            <!-- Result Wrapper -->
            <div id="resultState" class="hidden fade-in space-y-6">
                <!-- Content to be printed to PDF -->
                <div id="printableArea" class="space-y-6 pb-6 bg-white">
                    <!-- Injected via JS -->
                </div>
                
                <!-- Download Button (Excluded from PDF automatically by placing it outside printableArea) -->
                <button onclick="downloadPDF()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2 transition-colors shadow-md mt-8">
                    <i data-lucide="file-down" class="w-6 h-6"></i> Download Itinerary as PDF
                </button>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        // DOM Elements
        const uiApiKeyInput = document.getElementById('uiApiKey');
        const connectBtn = document.getElementById('connectBtn');
        const modelContainer = document.getElementById('modelContainer');
        const aiModelSelect = document.getElementById('aiModel');
        const apiStatus = document.getElementById('apiStatus');
        
        const form = document.getElementById('travelForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitWarning = document.getElementById('submitWarning');
        
        const initialState = document.getElementById('initialState');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const resultState = document.getElementById('resultState');
        const printableArea = document.getElementById('printableArea');

        // Load saved API key
        const savedKey = localStorage.getItem('wanderGeniusApiKey');
        if (savedKey) { uiApiKeyInput.value = savedKey; }

        // STEP 1: Connect
        connectBtn.addEventListener('click', async () => {
            const key = uiApiKeyInput.value.trim();
            if (!key) {
                showApiStatus("Please enter an API key.", "error");
                return;
            }
            connectBtn.textContent = "Connecting...";
            connectBtn.disabled = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "Failed to authenticate key.");

                const validModels = data.models.filter(m => m.name.includes('gemini') && m.supportedGenerationMethods.includes('generateContent'));
                if (validModels.length === 0) throw new Error("No Gemini models available for this key.");

                aiModelSelect.innerHTML = '';
                validModels.forEach(model => {
                    const option = document.createElement('option');
                    const modelName = model.name.replace('models/', '');
                    option.value = modelName;
                    option.textContent = modelName;
                    if(modelName === 'gemini-1.5-flash-latest' || modelName === 'gemini-2.5-flash') option.selected = true;
                    aiModelSelect.appendChild(option);
                });

                localStorage.setItem('wanderGeniusApiKey', key);
                modelContainer.classList.remove('hidden');
                submitBtn.disabled = false;
                submitWarning.classList.add('hidden');
                showApiStatus("Connected! Models loaded.", "success");
            } catch (err) {
                showApiStatus(err.message, "error");
                modelContainer.classList.add('hidden');
                submitBtn.disabled = true;
                submitWarning.classList.remove('hidden');
            } finally {
                connectBtn.textContent = "Connect & Find Models";
                connectBtn.disabled = false;
            }
        });

        function showApiStatus(msg, type) {
            apiStatus.textContent = msg;
            apiStatus.classList.remove('hidden', 'bg-red-500/20', 'text-red-400', 'bg-green-500/20', 'text-green-400');
            if (type === 'error') apiStatus.classList.add('bg-red-500/20', 'text-red-400');
            else apiStatus.classList.add('bg-green-500/20', 'text-green-400');
        }

        // STEP 2: Generate
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = uiApiKeyInput.value.trim();
            const selectedModel = aiModelSelect.value;
            if (!key || !selectedModel) return;

            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            const days = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;

            if (days <= 0 || days > 14) {
                showAppError("Please enter a valid date range (1 to 14 days).");
                return;
            }

            showLoading();

            const departure = document.getElementById('departure').value;
            const destination = document.getElementById('destination').value;
            const flightClass = document.getElementById('flightClass').value;
            const prefAirlines = document.getElementById('prefAirlines').value || "Any";
            const numPeople = document.getElementById('numPeople').value;
            const ages = document.getElementById('ages').value;
            const interests = document.getElementById('interests').value;
            const hotelPrefs = document.getElementById('hotelPrefs').value;

            // Updated prompt requesting pricing based on class and airlines
            const prompt = `Act as an expert travel planner. Create a ${days}-day itinerary for ${numPeople} people traveling from ${departure} to ${destination}. 
            Ages: ${ages}. Interests: ${interests}. Hotel preferences: ${hotelPrefs}.
            Flight preferences: ${flightClass} class. Preferred Airlines: ${prefAirlines}.
            
            You MUST return ONLY a valid JSON object with the exact following structure. Estimate realistic prices in USD. Do not include markdown blocks, just raw JSON:
            {
                "tripTitle": "String - Catchy title",
                "estimatedTotalBudget": "String - e.g., $4000 - $5500 total",
                "flightAdvice": {
                    "estimatedDuration": "String - e.g., 12 hours with 1 layover",
                    "typicalAirlines": "String - Based on their preference if possible",
                    "estimatedCostPerPerson": "String - e.g., $800 based on their chosen class",
                    "generalAdvice": "String - Booking advice"
                },
                "hotelRecommendations": [
                    { "name": "Hotel Name", "whyItFits": "Reason", "estimatedCostPerNight": "String - e.g., $200/night" }
                ],
                "itinerary": [
                    {
                        "dayNumber": 1,
                        "title": "Theme of day",
                        "morning": "Activity details",
                        "afternoon": "Activity details",
                        "evening": "Activity details",
                        "foodSuggestions": "Where to eat"
                    }
                ],
                "travelTips": ["Tip 1", "Tip 2"]
            }`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${key}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error?.message || `API Error: ${response.status}`);
                if (!data.candidates || !data.candidates[0].content) throw new Error("Received an empty response from the AI.");

                let responseText = data.candidates[0].content.parts[0].text;
                responseText = responseText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const resultJSON = JSON.parse(responseText);
                renderResults(resultJSON);
            } catch (err) {
                console.error(err);
                showAppError(err.message || "An unknown error occurred. Model might have failed to format JSON.");
            }
        });

        function showLoading() {
            submitBtn.disabled = true;
            initialState.classList.add('hidden');
            errorState.classList.add('hidden');
            resultState.classList.add('hidden');
            loadingState.classList.remove('hidden');
        }

        function showAppError(msg) {
            submitBtn.disabled = false;
            loadingState.classList.add('hidden');
            errorMessage.textContent = msg;
            errorState.classList.remove('hidden');
        }

        function renderResults(data) {
            loadingState.classList.add('hidden');
            submitBtn.disabled = false;

            // Generate HTML specifically inside printableArea
            let html = `
                <div class="border-b border-slate-200 pb-4 mb-4">
                    <h2 class="text-4xl font-extrabold text-slate-800">${data.tripTitle}</h2>
                    <p class="text-slate-600 font-bold mt-2 text-lg">Total Trip Estimate: <span class="text-green-600">${data.estimatedTotalBudget || 'N/A'}</span></p>
                </div>`;

            // Flight Information
            if (data.flightAdvice) {
                html += `
                <div class="bg-indigo-50 p-5 rounded-xl mb-6">
                    <h3 class="text-lg font-bold text-indigo-900 mb-3 flex items-center gap-2">
                        <i data-lucide="plane" class="w-5 h-5"></i> Flight Details
                    </h3>
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-indigo-100 space-y-2">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <span class="text-slate-600">Airlines</span>
                            <span class="font-bold text-slate-800">${data.flightAdvice.typicalAirlines}</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-100 py-2">
                            <span class="text-slate-600">Est. Duration</span>
                            <span class="font-bold text-slate-800">${data.flightAdvice.estimatedDuration}</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-100 py-2">
                            <span class="text-slate-600">Est. Cost (Per Person)</span>
                            <span class="font-bold text-green-600">${data.flightAdvice.estimatedCostPerPerson || 'N/A'}</span>
                        </div>
                        <p class="text-sm text-slate-700 pt-2"><b class="text-slate-900">Advice:</b> ${data.flightAdvice.generalAdvice}</p>
                    </div>
                </div>`;
            }

            // Hotels
            html += `
                <div class="bg-blue-50 p-5 rounded-xl mb-6">
                    <h3 class="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                        <i data-lucide="bed" class="w-5 h-5"></i> Hotel Recommendations
                    </h3>
                    <div class="space-y-3">`;
            data.hotelRecommendations.forEach(hotel => {
                html += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-blue-100 flex flex-col sm:flex-row sm:justify-between sm:items-start gap-2">
                        <div>
                            <p class="font-bold text-slate-800 text-lg">${hotel.name}</p>
                            <p class="text-sm text-slate-600 mt-1">${hotel.whyItFits}</p>
                        </div>
                        <div class="bg-green-50 text-green-700 font-bold px-3 py-1 rounded-md whitespace-nowrap border border-green-200">
                            ${hotel.estimatedCostPerNight || 'N/A'}
                        </div>
                    </div>`;
            });
            html += `</div></div>`;

            // Itinerary
            html += `
                <div class="mb-6">
                    <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i data-lucide="calendar-days" class="w-5 h-5"></i> Daily Itinerary
                    </h3>
                    <div class="space-y-6">`;
            data.itinerary.forEach(day => {
                html += `
                    <div class="border-l-4 border-blue-500 pl-4 py-1 relative">
                        <div class="absolute -left-2.5 top-2 w-4 h-4 rounded-full bg-blue-500 ring-4 ring-white"></div>
                        <h4 class="text-lg font-bold text-slate-800">Day ${day.dayNumber}: ${day.title}</h4>
                        <div class="mt-3 grid gap-3 text-sm text-slate-700">
                            <div class="bg-slate-50 p-3 rounded-md"><b>Morning:</b> ${day.morning}</div>
                            <div class="bg-slate-50 p-3 rounded-md"><b>Afternoon:</b> ${day.afternoon}</div>
                            <div class="bg-slate-50 p-3 rounded-md"><b>Evening:</b> ${day.evening}</div>
                            <div class="bg-orange-50 p-3 rounded-md border border-orange-100"><b>Dining:</b> ${day.foodSuggestions}</div>
                        </div>
                    </div>`;
            });
            html += `</div></div>`;

            // Tips
            html += `
                <div class="bg-slate-100 p-5 rounded-xl">
                    <h3 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <i data-lucide="info" class="w-5 h-5"></i> Quick Tips
                    </h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2">`;
            data.travelTips.forEach(tip => { html += `<li>${tip}</li>`; });
            html += `</ul></div>`;

            printableArea.innerHTML = html;
            lucide.createIcons();
            resultState.classList.remove('hidden');
        }

        // STEP 3: Generate PDF Function
        window.downloadPDF = function() {
            const element = document.getElementById('printableArea');
            
            const opt = {
                margin:       [0.5, 0.5, 0.5, 0.5], // Top, Left, Bottom, Right margins in inches
                filename:     'AI_Trip_Itinerary.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // Using html2pdf to generate and download
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>


```
